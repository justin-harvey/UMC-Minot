<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <linearGradient id="markGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e4002b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="markFlameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e4002b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e74c6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cross -->
  <path d="M25 3 L25 47 M8 25 L42 25"
        stroke="url(#markGradient)"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Flame -->
  <path d="M25 6
           Q32 12 32 20
           Q32 26 29 31
           Q27 35 25 38
           Q23 35 21 31
           Q18 26 18 20
           Q18 12 25 6 Z"
        fill="url(#markFlameGradient)"/>

  <!-- Inner flame highlight -->
  <path d="M25 12
           Q28 16 28 21
           Q28 25 25 28
           Q22 25 22 21
           Q22 16 25 12 Z"
        fill="rgba(255, 255, 255, 0.3)"/>
</svg>