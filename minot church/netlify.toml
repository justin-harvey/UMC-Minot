[build]
  # Build command (none needed for static site)
  command = "echo 'No build step required for static site'"

  # Publish directory (current directory contains all files)
  publish = "."

  # Netlify Forms / serverless functions directory
  functions = "netlify/functions"

# Redirect rules for clean URLs and SEO
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Consolidate onto the canonical domain (HTTPS + custom domain)
[[redirects]]
  from = "http://umc-minot.netlify.app/*"
  to = "https://umcminot.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://umc-minot.netlify.app/*"
  to = "https://umcminot.org/:splat"
  status = 301
  force = true

# 404 page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; frame-src https://padlet.com https://calendar.google.com; connect-src 'self';"

# Cache headers for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML with shorter duration
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# PWA headers
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Environment variables for forms (if needed)
[build.environment]
  NODE_VERSION = "18"

# Plugin configuration
[[plugins]]
  package = "@netlify/plugin-sitemap"

[[plugins]]
  package = "netlify-plugin-lighthouse"

  [plugins.inputs]
  results_dir = "lighthouse"

  [[plugins.inputs.audits]]
  url = "/"
  output_path = "reports/homepage.html"

  [[plugins.inputs.audits]]
  url = "/index.html"
  output_path = "reports/index.html"